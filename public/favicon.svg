<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Deep violet plate -->
  <rect width="32" height="32" rx="6" fill="#1d0e2b"/>
  <!-- Outer ring — imperial red -->
  <circle cx="16" cy="16" r="14" stroke="#f15153" stroke-width="1" fill="none" opacity="0.85"/>
  <!-- Inner ring — orchid -->
  <circle cx="16" cy="16" r="10" stroke="#a855f7" stroke-width="0.6" fill="none" opacity="0.55"/>
  <!-- AA monogram -->
  <text x="16" y="21" text-anchor="middle" font-size="13" font-weight="900"
        font-family="Inter,Arial,sans-serif" letter-spacing="-1"
        fill="url(#g)">AA</text>
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ff6d6f"/>
      <stop offset="50%"  stop-color="#d1548c"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
</svg>
